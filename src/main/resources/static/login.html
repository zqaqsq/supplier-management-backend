<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>供应商管理系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #666;
            margin: 0;
        }
        .form-floating {
            margin-bottom: 20px;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="bi bi-building" style="font-size: 3rem; color: #667eea; margin-bottom: 20px;"></i>
            <h2>供应商管理系统</h2>
            <p>请登录以继续操作</p>
        </div>
        
        <div id="alertContainer"></div>
        
        <form id="loginForm">
            <div class="form-floating">
                <input type="text" class="form-control" id="username" placeholder="用户名" required>
                <label for="username">用户名</label>
            </div>
            
            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="密码" required>
                <label for="password">密码</label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>登录
            </button>
        </form>
        
        <div class="text-center mt-4">
            <small class="text-muted">
                默认账号：admin / admin123<br>
                或 user / user123
            </small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 显示提示信息
    function showAlert(message, type) {
        const alertContainer = document.getElementById('alertContainer');
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        alertContainer.innerHTML = '';
        alertContainer.appendChild(alertDiv);
    }

    // 处理登录
    function handleLogin(event) {
        event.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        if (!username || !password) {
            showAlert('请输入用户名和密码', 'warning');
            return;
        }
        
        // 显示加载状态
        const submitBtn = document.querySelector('.btn-login');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = '登录中...';
        submitBtn.disabled = true;
        
        // 发送登录请求
        fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // 将登录信息保存到localStorage（与主页面的读取方式保持一致）
                const token = data.data.token;
                const userInfo = data.data;
                
                // 确保token和userInfo存在
                if (!token) {
                    showAlert('登录响应中缺少token', 'danger');
                    return;
                }
                
                // 保存到localStorage
                localStorage.setItem('authToken', token);
                localStorage.setItem('userInfo', JSON.stringify(userInfo));
                
                // 验证保存是否成功
                const savedToken = localStorage.getItem('authToken');
                const savedUserInfo = localStorage.getItem('userInfo');
                
                if (!savedToken || !savedUserInfo) {
                    console.error('Token保存失败');
                    showAlert('登录信息保存失败，请重试', 'danger');
                    return;
                }
                
                console.log('登录信息已保存:', { token: savedToken.substring(0, 20) + '...', userInfo: savedUserInfo });
                showAlert('登录成功，正在跳转...', 'success');
                
                // 延迟跳转，确保localStorage已完全写入
                setTimeout(() => {
                    // 使用replace并添加参数，标识是从登录页跳转过来的
                    window.location.replace('/index.html?from=login');
                }, 500);
            } else {
                showAlert(data.message || '登录失败', 'danger');
            }
        })
        .catch(error => {
            console.error('登录请求失败:', error);
            showAlert('登录请求失败，请检查网络连接', 'danger');
        })
        .finally(() => {
            // 恢复按钮状态
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        });
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        // 不再检查localStorage，每次都需要重新登录
        console.log('页面加载完成，需要重新登录');
        
        // 绑定登录表单提交事件
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    });
</script>
</body>
</html>
