<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>智能随机抽取供应商</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui-src/dist/css/layui.css">
    <style>
        .modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border-radius: 15px 15px 0 0;
            position: relative;
        }
        
        .modal-header h3 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .close-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .modal-body {
            padding: 30px;
        }
        
        .config-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 14px;
            width: 100%;
        }
        
        .extraction-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        
        .results-section {
            display: none;
            margin-top: 30px;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        
        .result-item {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: 2px solid #1976d2;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .result-order {
            background: #1976d2;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-weight: bold;
        }
        
        .action-buttons {
            text-align: center;
            margin-top: 25px;
        }
        
        .action-btn {
            margin: 0 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-retry { background: #ffc107; color: #333; }
        .btn-export { background: #17a2b8; color: white; }
        .btn-print { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="modal-container" id="extractionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>智能随机抽取供应商</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="config-section" id="configSection">
                    <h4>智能抽取配置</h4>
                    
                    <div class="form-group">
                        <label class="form-label">抽取数量</label>
                        <input type="number" class="form-control" id="extractionCount" value="3" min="3" max="5">
                        <small>请选择3-5家供应商，系统将使用加权随机算法进行智能抽取</small>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">资质等级</label>
                        <select class="form-control" id="qualificationLevel">
                            <option value="all">全部</option>
                            <option value="A级">A级</option>
                            <option value="B级">B级</option>
                            <option value="C级">C级</option>
                            <option value="D级">D级</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">行业</label>
                        <select class="form-control" id="industry">
                            <option value="all">全部</option>
                            <option value="制造业">制造业</option>
                            <option value="建筑业">建筑业</option>
                            <option value="服务业">服务业</option>
                            <option value="贸易业">贸易业</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">操作人</label>
                        <input type="text" class="form-control" id="operator" value="张三" readonly>
                    </div>
                    
                    <button class="extraction-btn" onclick="startExtraction()">开始智能抽取</button>
                </div>
                
                <div class="results-section" id="resultsSection">
                    <h3>🎉 抽取完成！</h3>
                    <div class="results-grid" id="resultsGrid"></div>
                    
                    <div class="action-buttons">
                        <button class="action-btn btn-retry" onclick="retryExtraction()">重新抽取</button>
                        <button class="action-btn btn-export" onclick="exportResults()">导出结果</button>
                        <button class="action-btn btn-print" onclick="printResults()">打印结果</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let suppliers = [];
        let selectedSuppliers = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadSuppliers();
        });
        
        function loadSuppliers() {
            const token = sessionStorage.getItem('authToken');
            if (!token) {
                loadDefaultSuppliers();
                return;
            }
            
            fetch('/api/suppliers/all', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
                .then(response => {
                    if (response.status === 401) {
                        loadDefaultSuppliers();
                        return Promise.reject(new Error('Token无效'));
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success && data.data) {
                        suppliers = data.data;
                    } else {
                        loadDefaultSuppliers();
                    }
                })
                .catch(error => {
                    if (error.message !== 'Token无效') {
                        console.error('加载供应商失败:', error);
                    }
                    loadDefaultSuppliers();
                });
        }
        
        function loadDefaultSuppliers() {
            suppliers = [
                {id: 1, name: "供应商A", qualification: "A级", industry: "制造业", region: "北京", status: "正常"},
                {id: 2, name: "供应商B", qualification: "B级", industry: "建筑业", region: "上海", status: "正常"},
                {id: 3, name: "供应商C", qualification: "A级", industry: "服务业", region: "广州", status: "正常"},
                {id: 4, name: "供应商D", qualification: "C级", industry: "制造业", region: "深圳", status: "正常"},
                {id: 5, name: "供应商E", qualification: "B级", industry: "贸易业", region: "杭州", status: "正常"}
            ];
        }
        
        function startExtraction() {
            const count = parseInt(document.getElementById('extractionCount').value);
            const qualification = document.getElementById('qualificationLevel').value;
            const industry = document.getElementById('industry').value;
            
            if (count < 3 || count > 5) {
                alert('抽取数量必须在3-5之间');
                return;
            }
            
            // 过滤符合条件的供应商
            let eligibleSuppliers = suppliers.filter(supplier => {
                if (qualification !== 'all' && supplier.qualification !== qualification) return false;
                if (industry !== 'all' && supplier.industry !== industry) return false;
                return supplier.status === '正常';
            });
            
            if (eligibleSuppliers.length === 0) {
                alert('没有找到符合条件的供应商');
                return;
            }
            
            // 随机选择供应商
            selectedSuppliers = [];
            for (let i = 0; i < Math.min(count, eligibleSuppliers.length); i++) {
                const randomIndex = Math.floor(Math.random() * eligibleSuppliers.length);
                selectedSuppliers.push(eligibleSuppliers[randomIndex]);
                eligibleSuppliers.splice(randomIndex, 1);
            }
            
            showResults();
        }
        
        function showResults() {
            const resultsGrid = document.getElementById('resultsGrid');
            resultsGrid.innerHTML = '';
            
            selectedSuppliers.forEach((supplier, index) => {
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                resultItem.innerHTML = `
                    <div class="result-order">${index + 1}</div>
                    <div><strong>${supplier.name}</strong></div>
                    <div>ID: ${supplier.id}</div>
                    <div>资质: ${supplier.qualification}</div>
                    <div>行业: ${supplier.industry}</div>
                    <div>地区: ${supplier.region}</div>
                `;
                resultsGrid.appendChild(resultItem);
            });
            
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('configSection').style.display = 'none';
        }
        
        function retryExtraction() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('configSection').style.display = 'block';
        }
        
        function exportResults() {
            if (selectedSuppliers.length === 0) return;
            
            let csvContent = '序号,供应商名称,ID,资质等级,行业,地区\n';
            selectedSuppliers.forEach((supplier, index) => {
                csvContent += `${index + 1},${supplier.name},${supplier.id},${supplier.qualification},${supplier.industry},${supplier.region}\n`;
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `供应商抽取结果_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }
        
        function printResults() {
            if (selectedSuppliers.length === 0) return;
            window.print();
        }
        
        // 关闭弹窗
        function closeModal() {
            document.getElementById('extractionModal').style.display = 'none';
            
            // 通知父页面关闭弹窗
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage('closeExtractionModal', '*');
                }
            } catch (e) {
                console.log('通知父页面失败');
            }
        }
        
        // 显示弹窗
        function showModal() {
            document.getElementById('extractionModal').style.display = 'flex';
        }
        
        // 暴露给外部调用的方法
        window.showExtractionModal = showModal;
        window.closeExtractionModal = closeModal;
        
        // 添加键盘事件监听
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        // 点击遮罩关闭弹窗
        document.getElementById('extractionModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
