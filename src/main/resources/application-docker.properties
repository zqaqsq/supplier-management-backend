# Docker 环境配置
# 使用 docker-compose.yml 中定义的环境变量

# 数据源
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/supplier_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:supplier_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Supplier@2024}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池配置
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# JPA 配置
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Session 配置
spring.session.store-type=none
server.servlet.session.timeout=0

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Actuator 健康检查
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
