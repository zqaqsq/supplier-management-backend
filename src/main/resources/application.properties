# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/supplier_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Session管理配置
spring.session.store-type=none
server.servlet.session.timeout=0
server.servlet.session.cookie.max-age=0
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 服务器配置 - 修改端口为8080
server.port=8080
server.servlet.context-path=/

# 日志配置
logging.level.com.example.suppliermanagement=DEBUG
logging.level.org.springframework.web=DEBUG

# Jackson配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# Swagger配置 - 修复兼容性问题
# 移除冲突的配置，只保留必要的springdoc配置
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# springfox 已不再维护，当前使用 springdoc，移除无效配置

# ============ AI/LLM 配置 ============
# AI 功能开关（设为 true 启用通义千问 API）
ai.enabled=false
# 通义千问 API Key（从阿里云百炼平台获取：https://bailian.console.aliyun.com/）
ai.api.key=
# API 端点（默认使用阿里云百炼平台）
ai.api.endpoint=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
# 使用的模型（qwen-plus 性价比高，qwen-max 效果更好）
ai.model=qwen-plus