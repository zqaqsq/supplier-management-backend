# MySQL数据库配置模板
# 请根据您的实际MySQL配置修改以下参数，然后复制到 src/main/resources/application.properties

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/supplier_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 服务器配置
server.port=8080
server.servlet.context-path=/

# 日志配置
logging.level.com.example.suppliermanagement=DEBUG
logging.level.org.springframework.web=DEBUG

# Jackson配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# Swagger配置
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# 数据库连接池配置（可选，用于生产环境）
# spring.datasource.hikari.maximum-pool-size=20
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.connection-timeout=30000
# spring.datasource.hikari.idle-timeout=600000
# spring.datasource.hikari.max-lifetime=1800000
